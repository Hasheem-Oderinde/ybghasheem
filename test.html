  <!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name ="viewport" content="width=device-width",
        initial-scale="1.0">
        <title>Hasheem</title>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.3/dist/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@7.12.15/dist/sweetalert2.all.min.js"></script>
    <style>



      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap');
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
body {
    font-family: 'Space Grotesk', sans-serif;
    background: linear-gradient(
        135deg,
        #0f172a,
        #1e293b
    );
    color: white;
}

nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 10%;
}
.links a {
    color: white;
    text-decoration: none;
    margin-left: 20px;
}
.links a:hover {
    color: aqua;
}
.hero {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 80px 10%;
    gap: 40px;
}
.hero-text h1 {
    font-size: 3rem;
}
.hero-text p {
    margin: 20px 0;
}
button {
    padding: 12px 25px;
    border: none;
    border-radius: 10px;
    background: #38bdf8;
    color: white;
    cursor: pointer;
    transition: .3s;
}
button:hover {
    transform: translate(-5px);
}

.button:active,
.active {
  top: 2px;
  left: 1px;
	box-shadow: none;
}

.hero-img img {
    width: 250px;
    border-radius: 50%;
}

.skills,
.projects,
.contact {
    padding: 70px 10%;
}

.skills h2,
.projects h2,
.contact h2 {
    margin-bottom: 30px;
}

.skills-container,
.projects-container {
    display: grid;
    grid-template-columns:
    repeat(auto-fit,
    minmax(200px, 1fr)
    );
    gap: 20px;
}

.card, 
.project {
    background: rgba(225, 225, 225, 0.08);
    padding: 20px;
    border-radius: 15px;
    backdrop-filter: blur(10px);
    transition: .3s;
}
.card:hover,
.project:hover {
    transform:
    translateY(-10px);
}
form {
    display: flex;
    flex-direction: column;
    gap: 15px;
}
input,
textarea {
    padding: 15px;
    border: none;
    border-radius: 10px;
}
textarea {
    height: 120px;
}
footer {
    text-align: center;
    padding: 30px;
}

@media(max-width:768px){
    nav {
        flex-direction: column;
        gap: 20px;
    }
    .hero {
        flex-direction: column;
        text-align: center;
    }
    .hero-text h1 {
    font-size: 2rem;
}
}



    </style>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    </head>
    <body>
        <!--
        <nav>
            <h2>YBG HASHEEM</h2>
            <div class ="links">
                <a href="#">Home</a>
                <a href="#">Achievements</a>
                <a href="#">Contact</a>
            </div>
        </nav>
    -->
        <section class= "hero">
            <div class ="hero-text">
            <h1>HASHEEM</h1>
            <p>Song Promotions</p>
            <!--
            <button>Get In Touch</button>
            -->
            </div>

            <div class="hero-img">
                <img src="img\hasheem.png.webp" alt="progamming-
                interface"/>
            </div>
        </section>

        <section class="skills">
            <h2>Achievements</h2>
            <div class="skills-container">
            <div class="card">
                <h3>5K</h3>
                <p>Followers</p>
            </div>
            <div class="card">
                <h3>4M</h3>
                <p>likes</p>
            </div>
            </div>
        </section>

        <section class="contact">
        <h2>Contact</h2>
        <form id="submit-to-google-sheet">
            <input
              type="text"
              name="name"
              id="name"
              placeholder="Name"
              required
            />

            <input
              type="email"
              name="email"
              id="email"
              placeholder="Email"
              required
            />

            <textarea
              name="message"
              id="message"
              placeholder="Message"
              required
            ></textarea>
          <button type="submit" class="btn btn-primary btn-block">

            Submit
          </button>
        </form>
        </section>


        <footer>
            <p>© 2026 Hasheem. All rights reserved.</p>
        </footer>
    </body>
</html>

<!--ends here-->




    <script>
      const scriptURL =                       
      "https://script.google.com/macros/s/AKfycbzN-q9yitos_Yg6ukXVf4o_t-FSLJCDL3wCP53TWUv8YcyAY0qMx5tVxF-dTwgwXomR/exec";
      const form = document.forms["submit-to-google-sheet"];
      form.addEventListener("submit", (e) => {
        e.preventDefault();
        var formData = new FormData(form);

        fetch(scriptURL, { method: "POST", body: formData })
          .then((response) => {
            swal("Done", "Submitted Successfully.", "success");
          })
          .catch((error) => {
            swal("Error", "Something went wrong. please try again!", "error");
          });
      });

      
    </script>
  </body>
</html>
